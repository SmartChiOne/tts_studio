name: Build & Release

# 推送 v* 标签时自动构建双平台安装包并发布 Release；
# 也可在 Actions 页面手动触发（仅构建，不发布）。
# 失败时自动把构建日志推到 ci-logs-* 分支，便于排查。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 构建 macOS .app
        shell: bash
        run: |
          set -o pipefail
          flet build macos 2>&1 | tee ci-macos-build.log
      - name: 打包 zip（实际产物名以构建输出为准）
        shell: bash
        run: |
          cd build/macos
          APP=$(ls -d *.app | head -1)
          echo "打包: $APP"
          zip -qry TTS-Studio-macOS.app.zip "$APP"
          mv TTS-Studio-macOS.app.zip ../..
      - name: 失败时回传日志
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-macos
          find build -maxdepth 4 > ci-macos-tree.txt 2>/dev/null || true
          git add ci-macos-*.log ci-macos-*.txt || true
          git commit -m "macos logs ${{ github.run_id }}" || true
          git push origin ci-logs-macos -f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app
          path: TTS-Studio-macOS.app.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 构建 Windows .exe
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # --no-rich-output:进度条的 ● 字符超出 Windows 控制台 cp1252 编码，会崩
        run: |
          set -o pipefail
          flet build windows --no-rich-output 2>&1 | tee ci-windows-build.log
      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\* -DestinationPath TTS-Studio-Windows.zip
      - name: 失败时回传日志
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-windows
          ls -la > ci-windows-ls.txt
          find build -maxdepth 4 > ci-windows-tree.txt 2>/dev/null || true
          git add ci-windows-*.log ci-windows-*.txt || true
          git commit -m "windows logs ${{ github.run_id }}" || true
          git push origin ci-logs-windows -f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          path: TTS-Studio-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TTS-Studio-macOS.app.zip
            TTS-Studio-Windows.zip
          generate_release_notes: true
